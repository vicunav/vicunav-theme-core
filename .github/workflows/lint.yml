name: Lint de PHP

on:
  pull_request:

permissions:
  contents: read

jobs:
  estandares-php:
    name: Estándares de código PHP (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php-version:
          - "8.1"
          - "8.4"

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v7

      - name: Configurar PHP y Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          coverage: none

      - name: Validar contratos declarativos
        shell: bash
        run: bash tests/run.sh

      - name: Instalar PHP_CodeSniffer y WordPress Coding Standards
        shell: bash
        run: |
          composer global config \
            allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require --dev --no-interaction --no-progress \
            "wp-coding-standards/wpcs:^3.0" \
            "dealerdirect/phpcodesniffer-composer-installer:^1.0"

      - name: Analizar archivos PHP
        shell: bash
        run: |
          mapfile -d '' archivos_php < <(
            find . -type f -name '*.php' \
              -not -path './.git/*' \
              -not -path './vendor/*' \
              -not -path './node_modules/*' \
              -print0
          )

          if (( ${#archivos_php[@]} == 0 )); then
            echo "No hay archivos PHP para analizar."
            exit 0
          fi

          phpcs_bin="$(composer global config bin-dir --absolute)/phpcs"
          "$phpcs_bin" --standard=WordPress "${archivos_php[@]}"

  tests-wp-eval-file:
    name: Tests wp eval-file (WordPress ${{ matrix.wordpress }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        wordpress:
          - "6.6"
          - "6.9"

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: wordpress_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v7

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          coverage: none
          ini-values: memory_limit=512M

      - name: Instalar WP-CLI
        shell: bash
        run: |
          curl -sS -o /usr/local/bin/wp \
            https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x /usr/local/bin/wp

      - name: Instalar un WordPress de prueba
        shell: bash
        run: |
          site=/tmp/wp-eval-site
          mkdir -p "$site"
          wp core download --path="$site" --version="${{ matrix.wordpress }}" --force
          wp config create --path="$site" \
            --dbname=wordpress_test --dbuser=root --dbpass=root --dbhost=127.0.0.1 \
            --force
          wp core install --path="$site" \
            --url="http://localhost" --title="CI" \
            --admin_user=admin --admin_password=admin --admin_email=admin@example.invalid

      - name: Activar el theme
        shell: bash
        run: |
          ln -s "$GITHUB_WORKSPACE" /tmp/wp-eval-site/wp-content/themes/vicunav-theme-core
          wp theme activate vicunav-theme-core --path=/tmp/wp-eval-site

      - name: Ejecutar tests wp eval-file
        shell: bash
        run: |
          wp eval-file tests/validate-wordpress-theme-json.php --path=/tmp/wp-eval-site
          wp eval-file tests/validate-wordpress-patterns.php --path=/tmp/wp-eval-site
